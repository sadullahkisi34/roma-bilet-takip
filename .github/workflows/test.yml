name: Telegram test mesaji
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test mesaji gonder
        run: |
          curl -s -o /dev/null \
            "https://api.telegram.org/bot${{ secrets.TG_BOT_TOKEN }}/sendMessage" \
            --data-urlencode "chat_id=${{ secrets.TG_CHAT_ID }}" \
            --data-urlencode "text=☁️ BULUT TESTI
Bu mesaj GitHub Actions uzerinden gonderildi (Mac'ten degil).
Calisan sunucu: $(uname -sr)
$(TZ=Europe/Istanbul date '+%d.%m.%Y %H:%M:%S')"
