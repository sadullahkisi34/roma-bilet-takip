name: Telegram test mesaji
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test mesaji gonder
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          MSG="☁️ BULUT TESTI"$'\n'"Bu mesaj GitHub Actions uzerinden gonderildi (Mac'ten degil)."$'\n'"Sunucu: $(uname -sr)"$'\n'"$(TZ=Europe/Istanbul date '+%d.%m.%Y %H:%M:%S')"
          curl -s -o /dev/null "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT_ID}" \
            --data-urlencode "text=${MSG}"
          echo "gonderildi"
